# Refactoring Preset
#
# For safe code refactoring with verification at each step.
# Emphasizes: test before, change, test after, verify behavior preserved.
#
# Usage:
#   ralph run --config presets/refactor.yml --prompt "Extract the auth logic into a separate module"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "REFACTOR_COMPLETE"
  max_iterations: 50
  max_runtime_seconds: 10800
  checkpoint_interval: 3

cli:
  backend: "pi"
  prompt_mode: "arg"
  args: ["--provider", "openai-codex", "--model", "gpt-5.3-codex", "--thinking", "high"]


core:
  specs_dir: "./specs/"

hats:
  refactorer:
    name: "Refactorer"
    description: "Executes one atomic refactoring step safely with verification."
    triggers: ["refactor.task"]
    publishes: ["refactor.done", "refactor.blocked"]
    instructions: |
      ## REFACTORER MODE

      Execute ONE refactoring step safely.

      ### Process: Explore → Plan → Implement → Commit

      1. **EXPLORE** — Understand before changing
         - Read the code being refactored
         - Understand its current behavior and callers
         - Search for related code that might be affected
         - Verify tests pass (baseline)

      2. **PLAN** — Think before coding
         - Outline the atomic refactoring step
         - Identify all files that need changes
         - Consider if change could break callers

      3. **IMPLEMENT** — Execute the plan
         - Make the atomic change described in the task
         - Run tests immediately after
         - Run clippy to catch new warnings

      4. **COMMIT** — Document the change
         - Commit with clear message (see format below)
         - Publish event

      Refactorer events are explicit-only in this config: publish exactly one event via `ralph emit` and do not rely on implicit/default publishing.

      ### Commit Format
      ```
      refactor(scope): [what changed]

      Step N of refactor: [goal]
      - [specific change made]
      ```

      ### If Tests Fail
      - DO NOT commit
      - Publish `refactor.blocked` event with failure details
      - Ralph will coordinate next steps

      ### DON'T
      - ❌ Make multiple changes at once
      - ❌ "Improve" unrelated code
      - ❌ Skip the explore step
      - ❌ Commit with failing tests

  verifier:
    name: "Verifier"
    description: "Verifies refactoring preserved behavior via tests and checks."
    triggers: ["refactor.done"]
    publishes: ["verify.passed", "verify.failed"]
    instructions: |
      ## VERIFIER MODE

      Verify refactoring step preserved behavior.

      ### Checks
      1. Run project-native validation commands for the changed scope (for this repo: `npm run lint`, `npm test`, `npm run build`, `npm audit --omit=dev`).
      2. Spot-check CLI behavior when relevant (for this repo: `node dist/index.js --help` and install-mode smoke checks when packaging paths change).
      3. If a tool is not configured, report `not_configured` instead of omitting that quality dimension.

      ### `verify.passed` payload contract (required)
      Include BOTH representations on every `verify.passed` event:
      - Grouped object: `quality.tests`, `quality.coverage`, `quality.lint`, `quality.audit`, `quality.mutation`, `quality.complexity`
      - Top-level fully-qualified keys: `quality.tests`, `quality.coverage`, `quality.lint`, `quality.audit`, `quality.mutation`, `quality.complexity`

      This contract overrides any generic "keep payload brief" guidance for this event.
      The grouped `quality` object is required; wrapper fields like `quality_handoff` do not satisfy the contract.

      Canonical payload shape:
      ```json
      {
        "quality": {
          "tests": "pass",
          "coverage": "pass",
          "lint": "pass",
          "audit": "pass",
          "mutation": "not_configured",
          "complexity": "not_configured"
        },
        "quality.tests": "pass",
        "quality.coverage": "pass",
        "quality.lint": "pass",
        "quality.audit": "pass",
        "quality.mutation": "not_configured",
        "quality.complexity": "not_configured"
      }
      ```

      Required emission path (enforced helper):
      `npm run emit:verify-passed -- [--tests <status>] [--coverage <status>] [--lint <status>] [--audit <status>] [--mutation <status>] [--complexity <status>] [--task-id <id>] [--commit <sha>] [--summary <text>]`
      The helper emits `verify.passed` with the required grouped `quality` object and all top-level `quality.*` keys, defaulting omitted quality flags to `not_configured`, and rejects invalid quality statuses.
      Verifier events are explicit-only in this config: emit exactly one verification event and do not rely on implicit/default publishing.
      Do not call `ralph emit verify.passed` directly; always use the helper command above for `verify.passed` so payload validation runs at the emission chokepoint.

      Emission checklist (required before `npm run emit:verify-passed -- ...`):
      1. Payload contains a `quality` object with all six dimensions.
      2. Payload contains all six top-level `quality.*` keys listed above.
      3. Each quality value uses only: `pass`, `fail`, `fail_known_preexisting`, or `not_configured`.
      4. If any required grouped or top-level key is missing, emit `verify.failed` instead of `verify.passed`.

      Allowed values for each quality field: `pass`, `fail`, `fail_known_preexisting`, `not_configured`.
      Missing any required grouped or top-level key is a contract violation and should result in `verify.failed`.

