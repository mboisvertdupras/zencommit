name: Release
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run smoke:install-matrix
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
          generate_release_notes: true
          overwrite_files: true

  publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Keep npm current so trusted publishing and provenance flows stay compatible.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
      - name: Publish (skip if already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "zencommit@$VERSION" version >/dev/null 2>&1; then
            echo "zencommit@$VERSION already published; skipping."
            exit 0
          fi
          # Use trusted publishing via GitHub OIDC; clear token auth if setup-node exported it.
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance
