name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platformId: linux-x64
            assetExt: ""
            outfile: dist/zencommit
          - os: macos-15-intel
            platformId: darwin-x64
            assetExt: ""
            outfile: dist/zencommit
          - os: macos-latest
            platformId: darwin-arm64
            assetExt: ""
            outfile: dist/zencommit
          - os: windows-latest
            platformId: win32-x64
            assetExt: ".exe"
            outfile: dist/zencommit.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - run: bun install --ignore-scripts
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - run: bun build --compile src/index.ts --outfile "${{ matrix.outfile }}"
      - name: Rename binary
        run: |
          mkdir -p dist
          mv "${{ matrix.outfile }}" "dist/zencommit-${{ steps.version.outputs.version }}-${{ matrix.platformId }}${{ matrix.assetExt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: zencommit-${{ matrix.platformId }}
          path: dist/zencommit-${{ steps.version.outputs.version }}-${{ matrix.platformId }}${{ matrix.assetExt }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Prepare release assets
        run: |
          mkdir -p release_out
          find release -maxdepth 2 -type f -name "zencommit-*" -exec cp {} release_out/ \;
          cd release_out
          sha256sum zencommit-* > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_out/*
          generate_release_notes: true
          overwrite_files: true

  publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
      - name: Publish (skip if already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "zencommit@$VERSION" version >/dev/null 2>&1; then
            echo "zencommit@$VERSION already published; skipping."
            exit 0
          fi
          npm publish --access public
